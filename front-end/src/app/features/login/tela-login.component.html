
<div class="login-wrapper">
  <mat-card class="login-card" appearance="outlined">
    <div class="brand-panel">
      <div class="brand-badge">PM</div>
      <p class="eyebrow">Product Management</p>
      <h1>Bem-vindo de volta</h1>
      <p class="brand-text">
        Acesse sua conta e continue gerenciando seus produtos com mais organização e agilidade.
      </p>
    </div>

    <div class="form-panel">
      <mat-card-header class="login-header">
        <mat-card-title>Entrar</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form class="login-form" autocomplete="off">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              name="gmail"
              [(ngModel)]="gmail"
              placeholder="seu@email.com"
              required
            />
            <mat-icon matSuffix>mail</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Senha</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              name="senha"
              [(ngModel)]="senha"
              maxlength="20"
              required
            />
            <button
              mat-icon-button
              matSuffix
              type="button"
              aria-label="Mostrar senha"
              (click)="toggleSenhaVisibility()"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-flat-button color="primary" class="login-button" (click)="logar()" type="button">
            Entrar
          </button>

          <div class="helper-row">
            <span>Não tem conta?</span>
            <button mat-button color="primary" type="button" (click)="cadastra()">
              Cadastre-se
            </button>
          </div>
        </form>
      </mat-card-content>
    </div>
  </mat-card>
</div>
