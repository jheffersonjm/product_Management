<mat-card>
  <mat-card-header class="card-header">
    <mat-card-title>
      Venha ser da nossa família
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput="matInput" required typeof="email" [(ngModel)]="nome">
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Gmail</mat-label>
      <input matInput="email"
             type="email"
             required
             pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
              [(ngModel)]="email">
            
    </mat-form-field>
  </mat-card-content>
</mat-card>
<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Telefone</mat-label>
      <input matInput="email"
             type="email"
             required
             maxlength="18"
             placeholder="(11) 99999-9999"
             [ngModel]="telefone|telefone"
             (ngModelChange)="telefone=limparTelefone($event)"
     
             >
    </mat-form-field>
  </mat-card-content>
</mat-card>
<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Criar Senha</mat-label>
      <input matInput="password"
             type="password"
             required
             maxlength="20"
             [(ngModel)]="senha"
      >
    </mat-form-field>
  </mat-card-content>
</mat-card>
<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Confirme a Senha</mat-label>
      <input matInput="password"
             type="password"
             maxlength="20"
             required
             [(ngModel)]="confirmarSenha"
             >
    </mat-form-field>
        <button mat-flat-button color="primary" (click)="criarUsuario()">Criar Usuário</button>

  </mat-card-content>
</mat-card>
