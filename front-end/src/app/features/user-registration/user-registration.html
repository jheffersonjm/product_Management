<div class="registration-wrapper">
  <mat-card class="registration-card" appearance="outlined">
    <div class="brand-panel">
      <div class="brand-badge">PM</div>
      <p class="eyebrow">Product Management</p>
      <h1>Crie sua conta</h1>
      <p class="brand-text">
        Cadastre-se para organizar seus clientes, produtos e tarefas em um único lugar.
      </p>
    </div>

    <div class="form-panel">
      <mat-card-header class="card-header">
        <mat-card-title>Vamos começar</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form class="registration-form" autocomplete="off">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nome completo</mat-label>
            <input matInput type="text" name="nome" [(ngModel)]="nome" required placeholder="Seu nome" />
            <mat-icon matSuffix>person</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" name="email" [(ngModel)]="email" required placeholder="seu@email.com" />
            <mat-icon matSuffix>mail</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Telefone</mat-label>
            <input
              matInput
              type="tel"
              name="telefone"
              [ngModel]="telefone"
              (ngModelChange)="telefone = limparTelefone($event)"
              maxlength="15"
              required
              placeholder="(11) 99999-9999"
            />
            <mat-icon matSuffix>phone</mat-icon>
          </mat-form-field>

          <div class="form-row">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Criar senha</mat-label>
              <input
                matInput
                [type]="hidePassword ? 'password' : 'text'"
                name="senha"
                [(ngModel)]="senha"
                maxlength="20"
                required
              />
              <button mat-icon-button matSuffix type="button" aria-label="Mostrar senha" (click)="toggleSenhaVisibility()">
                <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Confirmar senha</mat-label>
              <input
                matInput
                [type]="hideConfirmPassword ? 'password' : 'text'"
                name="confirmarSenha"
                [(ngModel)]="confirmarSenha"
                maxlength="20"
                required
              />
              <button mat-icon-button matSuffix type="button" aria-label="Mostrar confirmação da senha" (click)="toggleConfirmPasswordVisibility()">
                <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <button mat-flat-button color="primary" class="btn-register" type="button" (click)="criarUsuario()">
            Criar conta
          </button>

          <div class="helper-row">
            <span>Já tem uma conta?</span>
            <button mat-button color="primary" type="button" (click)="voltarParaLogin()">Entrar</button>
          </div>
        </form>
      </mat-card-content>
    </div>
  </mat-card>
</div>
